<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>훈민초 통합 링크</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f9fafb;
        }
        /* 상단바 배경을 선명하고 깔끔한 네이비 컬러로 유지 */
        .navbar {
            background-color: #1e293b; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid #0f172a;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.08);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav-spacer {
            display: flex;
            align-items: center;
            visibility: hidden;
            user-select: none;
            padding-right: 16px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            flex-grow: 1;
        }
        .nav-links a {
            display: flex;
            align-items: center;
            color: #cbd5e1;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14.5px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-links a:hover {
            background-color: #334155;
            color: #ffffff;
        }
        .nav-links a.active-link {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 600;
        }
        .right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 16px;
            border-left: 1px solid #334155;
            flex-shrink: 0;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            color: #f1f5f9;
            user-select: none;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 22px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #64748b;
            transition: .2s;
            border-radius: 22px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #3b82f6;
        }
        input:checked + .slider:before {
            transform: translateX(16px);
        }
        .gear-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            color: #cbd5e1;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gear-btn:hover {
            background-color: #334155;
            color: #ffffff;
            transform: rotate(45deg);
        }
        @media (max-width: 768px) {
            .nav-spacer {
                display: none;
            }
        }
        .content-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            display: flex;
        }
        .content-frame {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }
        .prep-message {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #f9fafb;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .prep-card {
            background: #ffffff;
            padding: 36px 48px;
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: center;
            border: 1px solid #e5e7eb;
        }
        .prep-card h3 {
            margin: 0;
            font-size: 18px;
            color: #111827;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #fff;
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        .modal-box h3 {
            margin-top: 0;
            font-size: 18px;
            color: #111827;
        }
        .menu-list {
            overflow-y: auto;
            flex-grow: 1;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .menu-item-row {
            display: flex;
            gap: 8px;
            align-items: center;
            background: #f9fafb;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            flex-wrap: wrap;
        }
        .menu-item-row input[type="text"] {
            flex: 1;
            min-width: 120px;
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13.5px;
        }
        .menu-item-row label {
            font-size: 12.5px;
            color: #4b5563;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            user-select: none;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }
        .btn-danger {
            background: #dc2626;
            color: white;
        }
        .add-form {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
            flex-wrap: wrap;
        }
        .add-form input[type="text"] {
            flex: 1;
            min-width: 130px;
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13.5px;
        }
        .pwd-input-field {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            margin: 12px 0 16px 0;
        }
        .loading-text {
            color: #cbd5e1;
            font-size: 13.5px;
            padding: 8px 16px;
        }
    </style>
</head>
<body>
    <header class="navbar" id="navbar">
        <div class="nav-spacer" aria-hidden="true"><span style="visibility: hidden;">스위치자리대체</span></div>
        <div class="nav-links" id="navLinksContainer"><span class="loading-text">메뉴 불러오는 중...</span></div>
        <div class="right-controls">
            <div class="toggle-container">
                <label class="switch"><input type="checkbox" id="newWindowToggle"><span class="slider"></span></label>
                <span>새 탭으로 열기</span>
            </div>
            <button id="gearBtn" class="gear-btn" title="메뉴 설정">
                <svg xmlns="http://w3.org" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.10a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="content-container">
        <iframe id="content-frame" name="content-window" class="content-frame" src="about:blank"></iframe>
        <div id="prepMessage" class="prep-message">
            <div class="prep-card"><h3>🚧 페이지 준비 중입니다</h3></div>
        </div>
    </main>
