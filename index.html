<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상단 메뉴바 및 하단 창 예제</title>
    <style>
        /* 기본 여백 초기화 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh; /* 화면 전체 높이 사용 */
        }

        /* 상단 메뉴바 전체 스타일 */
        .navbar {
            background-color: #333; /* 배경색 */
            display: flex;
            justify-content: center; /* 가운데 정렬 */
            flex-shrink: 0; /* 메뉴바 높이 고정 */
        }

        /* 메뉴 버튼 스타일 */
        .navbar a {
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        /* 마우스 올렸을 때 스타일 */
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }

        /* 하단 콘텐츠 창 영역 스타일 */
        .content-frame {
            flex-grow: 1; /* 남은 화면 전체를 채움 */
            width: 100%;
            border: none; /* 테두리 제거 */
        }
    </style>
</head>
<body>

    <!-- 상단 메뉴바 (target="content-window"를 통해 하단 iframe으로 연결) -->
    <nav class="navbar">
        <a href="https://www.youtube.com" target="content-window">1번 메뉴버튼 (유튜브)</a>
        <a href="https://docs.google.com/spreadsheets/d/1G253TyOfPWsYgZmuULGvrJhJi4W1X3MGIXGfW_BPFRk/edit?pli=1&gid=0#gid=0" target="content-window">2번 메뉴버튼 (공동문서)</a>
        <a href="https://daum.net" target="content-window">3번 메뉴버튼 (다음)</a>
        <a href="https://padlet.com/paparo09/2026-b4i26qmywba85v35" target="content-window">4번 메뉴버튼 (구글)</a>
    </nav>

    <!-- 버튼을 누르면 웹사이트가 표시될 하단 창 (기본화면은 유튜브 영상) -->
    <iframe name="content-window" class="content-frame" src="https://youtube.com">
        이 브라우저는 iframe을 지원하지 않습니다.
    </footer>

</body>
</html>
