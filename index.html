<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>훈민초 통합 링크</title>
    <style>
        /* === 다크/라이트 모드 테마 변수 정의 === */
        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            
            /* 네비게이션 바 스타일 */
            --nav-bg: rgba(255, 255, 255, 0.85);
            --nav-border: #e2e8f0;
            --nav-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            
            /* 메뉴 버튼 기본 상태 */
            --item-bg: #f1f5f9;
            --item-text: #334155;
            --item-border: #cbd5e1;
            
            /* 메뉴 버튼 호버 상태 */
            --item-hover-bg: #e2e8f0;
            --item-hover-text: #0f172a;
            
            /* 활성화(Active) 메뉴 강조 */
            --active-bg: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --active-text: #ffffff;
            --active-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            
            /* 우측 컨트롤 박스 */
            --control-bg: #ffffff;
            --control-border: #cbd5e1;
            
            /* 카드/모달 */
            --card-bg: #ffffff;
            --modal-bg: #ffffff;
        }

        /* 다크 모드 스타일 자동 적용 */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0b0f19;
                --text-color: #f8fafc;
                
                /* 네비게이션 바 스타일 (다크) */
                --nav-bg: rgba(15, 23, 42, 0.85);
                --nav-border: #1e293b;
                --nav-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
                
                /* 메뉴 버튼 기본 상태 (다크) - 대비와 시인성 강화 */
                --item-bg: #1e293b;
                --item-text: #e2e8f0;
                --item-border: #334155;
                
                /* 메뉴 버튼 호버 상태 (다크) */
                --item-hover-bg: #334155;
                --item-hover-text: #ffffff;
                
                /* 활성화(Active) 메뉴 강조 (다크 - 선명한 시인성) */
                --active-bg: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
                --active-text: #ffffff;
                --active-shadow: 0 4px 16px rgba(59, 130, 246, 0.5);
                
                /* 우측 컨트롤 박스 (다크) */
                --control-bg: #1e293b;
                --control-border: #334155;
                
                /* 카드/모달 (다크) */
                --card-bg: #0f172a;
                --modal-bg: #0f172a;
            }
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex; flex-direction: column; height: 100vh; 
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* === 세련되고 시인성 뛰어난 상단 네비게이션 바 === */
        .navbar {
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 24px;
            border-bottom: 1px solid var(--nav-border);
            box-shadow: var(--nav-shadow);
            flex-shrink: 0; flex-wrap: wrap; gap: 12px;
            z-index: 100;
            transition: all 0.3s ease;
        }
        .nav-spacer { display: flex; align-items: center; visibility: hidden; user-select: none; padding-right: 16px; }
        
        /* 중앙 메뉴 링크 목록 */
        .nav-links { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; flex-grow: 1; }
        .nav-links a {
            display: flex; align-items: center; 
            color: var(--item-text); 
            text-decoration: none;
            padding: 9px 18px; 
            border-radius: 10px; 
            font-size: 14.5px; 
            font-weight: 600;
            background-color: var(--item-bg);
            border: 1px solid var(--item-border);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: -0.2px;
        }
        .nav-links a:hover {
            background-color: var(--item-hover-bg);
            color: var(--item-hover-text);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        /* 눈에 확 띄는 활성화(Active) 메뉴 */
        .nav-links a.active-link {
            background: var(--active-bg);
            color: var(--active-text) !important;
            border-color: transparent;
            font-weight: 700;
            box-shadow: var(--active-shadow);
            transform: translateY(-1px);
        }

        /* 오른쪽 토글 & 설정 박스 */
        .right-controls {
            display: flex; align-items: center; gap: 14px;
            padding: 5px 8px 5px 14px;
            background-color: var(--control-bg);
            border: 1px solid var(--control-border);
            border-radius: 12px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .toggle-container { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--item-text); user-select: none; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .2s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        input:checked + .slider { background-color: #2563eb; }
        input:checked + .slider:before { transform: translateX(18px); }
        
        .gear-btn {
            background: var(--item-bg); 
            border: 1px solid var(--control-border); 
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 8px; 
            color: var(--item-text); 
            transition: all 0.25s ease;
        }
        .gear-btn:hover { background-color: #2563eb; color: #ffffff; border-color: #2563eb; transform: rotate(60deg); }
        
        @media (max-width: 768px) { .nav-spacer { display: none; } }

        /* 메인 컨텐츠 및 모달 스타일 */
        .content-container { flex-grow: 1; position: relative; width: 100%; display: flex; }
        .content-frame { flex-grow: 1; width: 100%; height: 100%; border: none; background-color: var(--bg-color); }
        .prep-message {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg-color);
            display: none; justify-content: center; align-items: center; z-index: 10;
        }
        .prep-card { background: var(--card-bg); padding: 36px 48px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2); text-align: center; border: 1px solid var(--control-border); }
        .prep-card h3 { margin: 0; font-size: 18px; color: var(--text-color); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: var(--modal-bg); color: var(--text-color); width: 90%; max-width: 640px; border-radius: 16px; padding: 24px; border: 1px solid var(--control-border); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); max-height: 85vh; display: flex; flex-direction: column; }
        .modal-box h3 { margin-top: 0; font-size: 18px; color: var(--text-color); }
        .menu-list { overflow-y: auto; flex-grow: 1; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
        .menu-item-row { display: flex; gap: 8px; align-items: center; background: var(--item-bg); padding: 8px 12px; border-radius: 10px; border: 1px solid var(--control-border); flex-wrap: wrap; }
        .menu-item-row input[type="text"] { flex: 1; min-width: 120px; padding: 6px 10px; border: 1px solid var(--control-border); background-color: var(--card-bg); color: var(--text-color); border-radius: 6px; font-size: 13.5px; }
        .menu-item-row label { font-size: 12.5px; color: var(--item-text); display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
        .btn-group { display: flex; gap: 8px; justify-content: flex-end; }
        .btn { padding: 8px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: var(--item-bg); color: var(--item-text); border: 1px solid var(--control-border); }
        .btn-secondary:hover { background: var(--item-hover-bg); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-icon { padding: 4px 8px; font-size: 12px; background: var(--card-bg); color: var(--text-color); border: 1px solid var(--control-border); border-radius: 6px; cursor: pointer; }
        .btn-icon:hover { background: var(--item-hover-bg); }
        .add-form { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--control-border); flex-wrap: wrap; }
        .add-form input[type="text"] { flex: 1; min-width: 130px; padding: 6px 10px; border: 1px solid var(--control-border); background-color: var(--card-bg); color: var(--text-color); border-radius: 6px; font-size: 13.5px; }
        .pwd-input-field { width: 100%; padding: 10px 12px; border: 1px solid var(--control-border); background-color: var(--card-bg); color: var(--text-color); border-radius: 8px; box-sizing: border-box; font-size: 14px; margin: 12px 0 16px 0; }
        .loading-text { color: var(--item-text); font-size: 13.5px; padding: 8px 16px; }
    </style>
</head>
<body>

    <header class="navbar" id="navbar">
        <div class="nav-spacer" aria-hidden="true"><span style="visibility: hidden;">스위치자리대체</span></div>
        <div class="nav-links" id="navLinksContainer"><span class="loading-text">메뉴 불러오는 중...</span></div>
        <div class="right-controls">
            <div class="toggle-container">
                <label class="switch"><input type="checkbox" id="newWindowToggle"><span class="slider"></span></label>
                <span>새 탭으로 열기</span>
            </div>
            <button id="gearBtn" class="gear-btn" title="메뉴 설정">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.10a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="content-container">
        <iframe id="content-frame" name="content-window" class="content-frame" src="about:blank"></iframe>
        <div id="prepMessage" class="prep-message">
            <div class="prep-card"><h3>🚧 페이지 준비 중입니다</h3></div>
        </div>
    </main>

    <div id="pwdModal" class="modal-overlay">
        <div class="modal-box" style="max-width: 360px;">
            <h3>관리자 인증</h3>
            <p style="font-size: 13.5px; opacity: 0.8; margin: 0;">설정 비밀번호를 입력해주세요.</p>
            <input type="password" id="pwdInput" class="pwd-input-field" placeholder="비밀번호 입력">
            <div class="btn-group">
                <button class="btn btn-primary" id="confirmPwdBtn">확인</button>
                <button class="btn btn-secondary" id="closePwdBtn">취소</button>
            </div>
        </div>
    </div>

    <div id="menuModal" class="modal-overlay">
        <div class="modal-box">
            <h3>메뉴 설정 (공용 동기화)</h3>
            <div class="menu-list" id="modalMenuList"></div>
            <div class="add-form">
                <input type="text" id="newMenuText" placeholder="새 메뉴 이름 (예: 5. 새 메뉴)">
                <input type="text" id="newMenuUrl" placeholder="URL 주소">
                <label style="display:flex; align-items:center; gap:4px; font-size:13px;"><input type="checkbox" id="newMenuOpenNew"> 새 탭</label>
                <button class="btn btn-primary" id="addMenuBtn">추가</button>
            </div>
            <div class="btn-group" style="margin-top: 16px;">
                <button class="btn btn-primary" id="saveMenuBtn">저장 및 공용반영</button>
                <button class="btn btn-secondary" id="closeModalBtn">닫기</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbz7pd5yqw3tit8eA_ZPk2nf-Trz80MrcHNHXXyZ6dk9tLuEEfYagcgETocvjIFnd3FH/exec';
        const ADMIN_PWD_HASH = '1f0be3bf83dbbfb9e7ae70ecbebc79d2b86bb31015f8a00bc973e2185387d853';

        const DEFAULT_MENUS = [
            { text: '1. 특별실 예약', url: 'https://docs.google.com/spreadsheets/d/19Mka1E9OB_HW-Gb-_OGEN8CWE2_o9pWKC01RH39SUqA/edit?gid=1784243194#gid=1784243194', openNew: false },
            { text: '2. 개별학생교육', url: 'https://docs.google.com/spreadsheets/d/1WhR1BTbOwF3z4Xk6ZolPjexXWIPRMAhFtvmb8CaOQlE/edit?gid=779125143#gid=779125143', openNew: false },
            { text: '3. 돌봄&방과후', url: 'https://docs.google.com/spreadsheets/d/1QKmvjeODqRzO805KYB4xQdapmPpHoFV2i1McdGvgU-k/edit?gid=214054720#gid=214054720', openNew: false },
            { text: '4. 연수자료', url: 'https://padlet.com/paparo09/2026-b4i26qmywba85v35', openNew: false }
        ];

        let currentMenus = [];
        const toggle =
