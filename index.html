<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>훈민초 통합 링크</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; flex-direction: column; height: 100vh; background-color: #f9fafb;
        }
        .navbar {
            background-color: #ffffff; display: flex; align-items: center; justify-content: space-between;
            padding: 10px 20px; border-bottom: 1px solid #e5e7eb; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.02);
            flex-shrink: 0; flex-wrap: wrap; gap: 10px;
        }
        .nav-spacer { display: flex; align-items: center; visibility: hidden; user-select: none; padding-right: 16px; }
        .nav-links { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; flex-grow: 1; }
        .nav-links a {
            display: flex; align-items: center; color: #4b5563; text-decoration: none;
            padding: 8px 16px; border-radius: 8px; font-size: 14.5px; font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-links a:hover { background-color: #f3f4f6; color: #111827; }
        .nav-links a.active-link { background-color: #eff6ff; color: #2563eb; font-weight: 600; }
        .right-controls { display: flex; align-items: center; gap: 12px; padding-left: 16px; border-left: 1px solid #e5e7eb; flex-shrink: 0; }
        .toggle-container { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #4b5563; user-select: none; }
        .switch { position: relative; display: inline-block; width: 38px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .2s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
        input:checked + .slider { background-color: #2563eb; }
        input:checked + .slider:before { transform: translateX(16px); }
        .gear-btn {
            background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; border-radius: 8px; color: #4b5563; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gear-btn:hover { background-color: #f3f4f6; color: #111827; transform: rotate(45deg); }
        @media (max-width: 768px) { .nav-spacer { display: none; } }
        .content-container { flex-grow: 1; position: relative; width: 100%; display: flex; }
        .content-frame { flex-grow: 1; width: 100%; height: 100%; border: none; background-color: #ffffff; }
        .prep-message {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #f9fafb;
            display: none; justify-content: center; align-items: center; z-index: 10;
        }
        .prep-card { background: #ffffff; padding: 36px 48px; border-radius: 14px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); text-align: center; border: 1px solid #e5e7eb; }
        .prep-card h3 { margin: 0; font-size: 18px; color: #111827; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: #fff; width: 90%; max-width: 550px; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-height: 85vh; display: flex; flex-direction: column; }
        .modal-box h3 { margin-top: 0; font-size: 18px; color: #111827; }
        .menu-list { overflow-y: auto; flex-grow: 1; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
        .menu-item-row { display: flex; gap: 8px; align-items: center; background: #f9fafb; padding: 8px 12px; border-radius: 8px; border: 1px solid #e5e7eb; }
        .menu-item-row input { flex: 1; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13.5px; }
        .btn-group { display: flex; gap: 8px; justify-content: flex-end; }
        .btn { padding: 8px 16px; border-radius: 6px; font-size: 13.5px; font-weight: 500; cursor: pointer; border: none; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-secondary { background: #e5e7eb; color: #374151; }
        .btn-danger { background: #dc2626; color: white; }
        .add-form { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e5e7eb; }
        .pwd-input-field { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 14px; margin: 12px 0 16px 0; }
    </style>
</head>
<body>

    <header class="navbar" id="navbar">
        <div class="nav-spacer" aria-hidden="true"><span style="visibility: hidden;">스위치자리대체</span></div>
        <div class="nav-links" id="navLinksContainer"></div>
        <div class="right-controls">
            <div class="toggle-container">
                <label class="switch"><input type="checkbox" id="newWindowToggle"><span class="slider"></span></label>
                <span>새창에서 열기</span>
            </div>
            <button id="gearBtn" class="gear-btn" title="메뉴 설정">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.10a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="content-container">
        <iframe id="content-frame" name="content-window" class="content-frame" src="about:blank"></iframe>
        <div id="prepMessage" class="prep-message">
            <div class="prep-card"><h3>🚧 페이지 준비 중입니다</h3></div>
        </div>
    </main>

    <div id="pwdModal" class="modal-overlay">
        <div class="modal-box" style="max-width: 360px;">
            <h3>관리자 인증</h3>
            <p style="font-size: 13.5px; color: #6b7280; margin: 0;">설정 비밀번호를 입력해주세요.</p>
            <input type="password" id="pwdInput" class="pwd-input-field" placeholder="비밀번호 입력">
            <div class="btn-group">
                <button class="btn btn-primary" id="confirmPwdBtn">확인</button>
                <button class="btn btn-secondary" id="closePwdBtn">취소</button>
            </div>
        </div>
    </div>

    <div id="menuModal" class="modal-overlay">
        <div class="modal-box">
            <h3>메뉴 설정 (공용 동기화)</h3>
            <div class="menu-list" id="modalMenuList"></div>
            <div class="add-form">
                <input type="text" id="newMenuText" placeholder="새 메뉴 이름 (예: 4. 새 메뉴)">
                <input type="text" id="newMenuUrl" placeholder="URL 주소 (비워두면 준비중 화면)">
                <button class="btn btn-primary" id="addMenuBtn">추가</button>
            </div>
            <div class="btn-group" style="margin-top: 16px;">
                <button class="btn btn-primary" id="saveMenuBtn">저장 및 공용반영</button>
                <button class="btn btn-secondary" id="closeModalBtn">닫기</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbz7pd5yqw3tit8eA_ZPk2nf-Trz80MrcHNHXXyZ6dk9tLuEEfYagcgETocvjIFnd3FH/exec';

        const DEFAULT_MENUS = [
            { text: '1. 늘봄&방과후', url: 'https://docs.google.com/spreadsheets/d/1cmGEgyH_C6u1deECFZOlCGaT7ilFVRtVsh6vgWbT6m4/edit?gid=1317717015#gid=1317717015' },
            { text: '2. 개별화교육', url: 'https://docs.google.com/spreadsheets/d/1G253TyOfPWsYgZmuULGvrJhJi4W1X3MGIXGfW_BPFRk/edit?pli=1&gid=0#gid=0' },
            { text: '3. 연수자료', url: 'https://padlet.com/paparo09/2026-b4i26qmywba85v35' }
        ];

        let currentMenus = [];
        const toggle = document.getElementById('newWindowToggle');
        const iframe = document.getElementById('content-frame');
        const prepMessage = document.getElementById('prepMessage');
        const navLinksContainer = document.getElementById('navLinksContainer');

        const gearBtn = document.getElementById('gearBtn');
        const pwdModal = document.getElementById('pwdModal');
        const pwdInput = document.getElementById('pwdInput');
        const confirmPwdBtn = document.getElementById('confirmPwdBtn');
        const closePwdBtn = document.getElementById('closePwdBtn');

        const menuModal = document.getElementById('menuModal');
        const modalMenuList = document.getElementById('modalMenuList');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const saveMenuBtn = document.getElementById('saveMenuBtn');
        const addMenuBtn = document.getElementById('addMenuBtn');
        const newMenuText = document.getElementById('newMenuText');
        const newMenuUrl = document.getElementById('newMenuUrl');

        toggle.checked = localStorage.getItem('openInNewWindow') === 'true';
        toggle.addEventListener('change', () => {
            localStorage.setItem('openInNewWindow', toggle.checked);
        });

        async function fetchWithTimeout(url, options = {}, timeout = 4000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(timer);
                return response;
            } catch (err) {
                clearTimeout(timer);
                throw err;
            }
        }

        function loadMenusFast() {
            const cached = localStorage.getItem('hunmin_cached_menus');
            if (cached) {
                try {
                    currentMenus = JSON.parse(cached);
                } catch(e) {
                    currentMenus = DEFAULT_MENUS;
                }
            } else {
                currentMenus = DEFAULT_MENUS;
            }
            renderNavbar(true);
            loadInitialContent();

            fetchWithTimeout(GAS_URL, {}, 3000)
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (Array.isArray(data) && data.length > 0) {
                        currentMenus = data;
                        localStorage.setItem('hunmin_cached_menus', JSON.stringify(data));
                        renderNavbar(false);
                    }
                })
                .catch(err => console.log('백그라운드 동기화 스킵/타임아웃'));
        }

        // URL이 비어있으면 준비중 화면, 있으면 iframe 표시
        function updateDisplayByMenu(menuObj) {
            const hasValidUrl = menuObj && menuObj.url && menuObj.url.trim() !== '';
            
            if (!hasValidUrl) {
                iframe.style.display = 'none';
                prepMessage.style.display = 'flex';
            } else {
                iframe.style.display = 'block';
                prepMessage.style.display = 'none';
                iframe.src = menuObj.url;
            }
        }

        function loadInitialContent() {
            if (currentMenus.length > 0 && !toggle.checked) {
                updateDisplayByMenu(currentMenus[0]);
            }
        }

        async function saveMenusToCloud(newArray) {
            try {
                const sanitized = newArray.map(item => ({
                    text: (item.text || '').trim(),
                    url: (item.url || '').trim()
                }));

                const res = await fetchWithTimeout(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(sanitized),
                    redirect: 'follow'
                }, 6000);

                if (!res.ok) throw new Error(`서버 응답 오류 (HTTP ${res.status})`);
                
                currentMenus = sanitized;
                localStorage.setItem('hunmin_cached_menus', JSON.stringify(sanitized));
                renderNavbar(false);
                loadInitialContent();
                alert('공용 메뉴가 성공적으로 동기화되었습니다!');
            } catch (err) {
                console.error('저장 상세 오류:', err);
                alert('저장 중 오류가 발생했습니다. (GAS 웹 앱 배포 권한 또는 URL 형식을 확인해주세요)\n오류 내용: ' + err.message);
            }
        }

        function renderNavbar(isInitial = false) {
            const activeEl = navLinksContainer.querySelector('.active-link');
            const targetActiveText = isInitial 
                ? (currentMenus[0] ? currentMenus[0].text : '') 
                : (activeEl ? activeEl.textContent : (currentMenus[0] ? currentMenus[0].text : ''));

            navLinksContainer.innerHTML = '';
            currentMenus.forEach((menu) => {
                const a = document.createElement('a');
                a.href = menu.url || '#';
                a.target = 'content-window';
                a.textContent = menu.text;
                a.dataset.url = menu.url || '';
                if (menu.text === targetActiveText) {
                    a.classList.add('active-link');
                }
                navLinksContainer.appendChild(a);
            });
            bindNavEvents();
        }

        function bindNavEvents() {
            const navLinks = navLinksContainer.querySelectorAll('a');
            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    navLinks.forEach(item => item.classList.remove('active-link'));
                    this.classList.add('active-link');
                    
                    const menuText = this.textContent;
                    const menuUrl = this.dataset.url;
                    const matchedMenu = { text: menuText, url: menuUrl };

                    if (toggle.checked) {
                        e.preventDefault();
                        if (menuUrl && menuUrl.trim() !== '') {
                            window.open(menuUrl, '_blank');
                        } else {
                            alert('설정된 URL이 없어 준비 중인 페이지입니다.');
                        }
                        return;
                    }

                    e.preventDefault();
                    updateDisplayByMenu(matchedMenu);
                });
            });
        }

        gearBtn.addEventListener('click', () => {
            pwdInput.value = '';
            pwdModal.style.display = 'flex';
            setTimeout(() => pwdInput.focus(), 50);
        });

        function verifyPassword() {
            if (pwdInput.value === 'gnsalsch147#') {
                pwdModal.style.display = 'none';
                openModal();
            } else {
                alert('비밀번호가 틀렸습니다.');
                pwdInput.value = '';
                pwdInput.focus();
            }
        }

        confirmPwdBtn.addEventListener('click', verifyPassword);
        pwdInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyPassword(); });
        closePwdBtn.addEventListener('click', () => { pwdModal.style.display = 'none'; });

        function openModal() { renderModalList(); menuModal.style.display = 'flex'; }
        closeModalBtn.addEventListener('click', () => { menuModal.style.display = 'none'; });

        function renderModalList() {
            modalMenuList.innerHTML = '';
            currentMenus.forEach((menu, idx) => {
                const row = document.createElement('div');
                row.className = 'menu-item-row';
                row.innerHTML = `
                    <input type="text" value="${escapeHtml(menu.text)}" data-idx="${idx}" class="edit-text" placeholder="메뉴명">
                    <input type="text" value="${escapeHtml(menu.url)}" data-idx="${idx}" class="edit-url" placeholder="URL (비워두면 준비중 화면)">
                    <button class="btn btn-danger delete-btn" data-idx="${idx}">삭제</button>
                `;
                modalMenuList.appendChild(row);
            });
            modalMenuList.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.currentTarget.getAttribute('data-idx');
                    currentMenus.splice(idx, 1);
                    renderModalList();
                });
            });
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        addMenuBtn.addEventListener('click', () => {
            const text = newMenuText.value.trim();
            const url = newMenuUrl.value.trim();
            if (!text) { alert('메뉴 이름을 입력해주세요.'); return; }
            currentMenus.push({ text, url });
            newMenuText.value = ''; newMenuUrl.value = '';
            renderModalList();
        });

        saveMenuBtn.addEventListener('click', async () => {
            const textInputs = modalMenuList.querySelectorAll('.edit-text');
            const urlInputs = modalMenuList.querySelectorAll('.edit-url');
            const updated = [];
            for (let i = 0; i < textInputs.length; i++) {
                updated.push({
                    text: textInputs[i].value.trim(),
                    url: urlInputs[i].value.trim()
                });
            }
            await saveMenusToCloud(updated);
            menuModal.style.display = 'none';
        });

        loadMenusFast();
    </script>
</body>
</html>
