<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모던 상단 메뉴바 예제</title>
    <style>
        /* 기본 여백 및 폰트 초기화 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f9fafb;
        }

        /* 상단 메뉴바 (모던 대시보드 스타일) */
        .navbar {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px; /* 메뉴 간격 */
            padding: 10px 20px;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.02);
            flex-shrink: 0;
        }

        /* 메뉴 버튼 스타일 (라운드 탭 형태) */
        .navbar a {
            display: flex;
            align-items: center;
            color: #4b5563;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14.5px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 마우스 올렸을 때 */
        .navbar a:hover {
            background-color: #f3f4f6;
            color: #111827;
        }

        /* 클릭한(활성화된) 메뉴 유지 스타일 */
        .navbar a.active-link {
            background-color: #eff6ff; /* 연한 블루 배경 */
            color: #2563eb;          /* 포인트 블루 텍스트 */
            font-weight: 600;
        }

        /* 하단 콘텐츠 창 영역 스타일 */
        .content-frame {
            flex-grow: 1;
            width: 100%;
            border: none;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 상단 메뉴바 -->
    <nav class="navbar" id="navbar">
        <a href="https://www.daum.net" target="content-window" class="active-link">1번 특별실 예약</a>
        <a href="https://docs.google.com/spreadsheets/d/1G253TyOfPWsYgZmuULGvrJhJi4W1X3MGIXGfW_BPFRk/edit?pli=1&gid=0#gid=0" target="content-window">2번 개별화교육</a>
        <a href="https://docs.google.com/spreadsheets/d/1cmGEgyH_C6u1deECFZOlCGaT7ilFVRtVsh6vgWbT6m4/edit?gid=1317717015#gid=1317717015" target="content-window">3번 늘봄&방과후</a>
        <a href="https://padlet.com/paparo09/2026-b4i26qmywba85v35" target="content-window">4번 연수자료</a>
    </nav>

    <!-- 하단 창 (첫 번째 링크와 초기화면 일치시킴) -->
    <iframe name="content-window" class="content-frame" src="https://www.daum.net">
        이 브라우저는 iframe을 지원하지 않습니다.
    </iframe>

    <script>
        const navLinks = document.querySelectorAll('.navbar a');

        navLinks.forEach(link => {
            link.addEventListener('click', function() {
                navLinks.forEach(item => item.classList.remove('active-link'));
                this.classList.add('active-link');
            });
        });
    </script>

</body>
</html>
