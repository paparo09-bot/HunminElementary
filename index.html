<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>훈민초 통합 링크</title>
    <style>
        /* 기본 여백 및 폰트 초기화 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f9fafb;
        }

        /* 상단 메뉴바 (3분할 밸런스 구조: 좌측여백 / 중앙메뉴 / 우측스위치) */
        .navbar {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.02);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* 좌측 균형용 스페이서 */
        .nav-spacer {
            display: flex;
            align-items: center;
            visibility: hidden;
            user-select: none;
            padding-right: 16px;
        }

        /* 중앙 메뉴 링크 그룹 */
        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            flex-grow: 1;
        }

        /* 메뉴 버튼 스타일 */
        .nav-links a {
            display: flex;
            align-items: center;
            color: #4b5563;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14.5px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-links a:hover {
            background-color: #f3f4f6;
            color: #111827;
        }

        .nav-links a.active-link {
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 600;
        }

        /* 우측 새창 열기 스위치 영역 스타일 */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            color: #4b5563;
            user-select: none;
            padding-left: 16px;
            border-left: 1px solid #e5e7eb;
            flex-shrink: 0;
        }

        /* 스위치 디자인 */
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1; transition: .2s; border-radius: 22px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .2s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #2563eb; }
        input:checked + .slider:before { transform: translateX(16px); }

        @media (max-width: 768px) {
            .nav-spacer { display: none; }
        }

        /* 하단 콘텐츠 컨테이너 (relative 기준) */
        .content-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            display: flex;
        }

        /* 하단 iframe 창 */
        .content-frame {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }

        /* 페이지 준비 중 안내 화면 스타일 */
        .prep-message {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #f9fafb;
            display: none; /* 기본 숨김 */
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .prep-card {
            background: #ffffff;
            padding: 36px 48px;
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            text-align: center;
            border: 1px solid #e5e7eb;
        }
        .prep-card h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: #111827;
        }
        .prep-card p {
            margin: 0;
            color: #6b7280;
            font-size: 14.5px;
        }
    </style>
</head>
<body>

    <!-- 상단 메뉴바 -->
    <header class="navbar" id="navbar">
        <div class="nav-spacer" aria-hidden="true">
            <span style="visibility: hidden;">스위치자리대체</span>
        </div>

        <div class="nav-links">
            <a href="https://www.daum.net" target="content-window" class="active-link">1. 특별실 예약</a>
            <a href="https://docs.google.com/spreadsheets/d/1G253TyOfPWsYgZmuULGvrJhJi4W1X3MGIXGfW_BPFRk/edit?pli=1&gid=0#gid=0" target="content-window">2. 개별화교육</a>
            <a href="https://docs.google.com/spreadsheets/d/1cmGEgyH_C6u1deECFZOlCGaT7ilFVRtVsh6vgWbT6m4/edit?gid=1317717015#gid=1317717015" target="content-window">3. 늘봄&방과후</a>
            <a href="https://padlet.com/paparo09/2026-b4i26qmywba85v35" target="content-window">4. 연수자료</a>
        </div>
        
        <div class="toggle-container">
            <label class="switch">
                <input type="checkbox" id="newWindowToggle">
                <span class="slider"></span>
            </label>
            <span>새창에서 열기</span>
        </div>
    </header>

    <!-- 하단 콘텐츠 영역 (iframe + 준비중 안내 오버레이) -->
    <main class="content-container">
        <iframe id="content-frame" name="content-window" class="content-frame" src="https://www.daum.net">
            이 브라우저는 iframe을 지원하지 않습니다.
        </iframe>
        
        <div id="prepMessage" class="prep-message">
            <div class="prep-card">
                <h3>🚧 페이지 준비 중입니다</h3>
                <p>개별화교육 페이지는 추후 안내할 예정입니다.</p>
            </div>
        </div>
    </main>

    <script>
        const navLinks = document.querySelectorAll('.nav-links a');
        const toggle = document.getElementById('newWindowToggle');
        const iframe = document.getElementById('content-frame');
        const prepMessage = document.getElementById('prepMessage');

        // 1. localStorage에서 설정 불러오기
        const savedNewWindow = localStorage.getItem('openInNewWindow') === 'true';
        toggle.checked = savedNewWindow;

        // 2. 스위치 변경 시 저장
        toggle.addEventListener('change', function() {
            localStorage.setItem('openInNewWindow', this.checked);
        });

        // 3. 링크 클릭 제어
        navLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                navLinks.forEach(item => item.classList.remove('active-link'));
                this.classList.add('active-link');

                // 2번 개별화교육인 경우
                if (this.textContent.includes('개별화교육')) {
                    e.preventDefault();
                    iframe.style.display = 'none';
                    prepMessage.style.display = 'flex';
                } else {
                    // 나머지 정상 링크인 경우
                    iframe.style.display = 'block';
                    prepMessage.style.display = 'none';

                    if (toggle.checked) {
                        e.preventDefault();
                        window.open(this.href, '_blank');
                    }
                }
            });
        });
    </script>

</body>
</html>
